# OpenShift / Kubernetes — Copilot Metrics Viewer documentation (static site)
# Adjust namespace, image, and Route host for your cluster.
---
apiVersion: v1
kind: Namespace
metadata:
  name: copilot-metrics-docs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: copilot-metrics-docs
  namespace: copilot-metrics-docs
  labels:
    app: copilot-metrics-docs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: copilot-metrics-docs
  template:
    metadata:
      labels:
        app: copilot-metrics-docs
    spec:
      containers:
        - name: nginx
          image: copilot-metrics-docs:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: copilot-metrics-docs
  namespace: copilot-metrics-docs
spec:
  selector:
    app: copilot-metrics-docs
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: copilot-metrics-docs
  namespace: copilot-metrics-docs
spec:
  to:
    kind: Service
    name: copilot-metrics-docs
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
